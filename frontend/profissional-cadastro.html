<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cadastro Profissional | Imperio Cerimonial</title><link rel="stylesheet" href="styles.css"></head><body><main class="login"><section class="login-card wide"><div class="brand">✦ Imperio Cerimonial</div><h1>Cadastro profissional</h1><p class="muted">Envie seus dados para entrar na rede de profissionais.</p><form class="form" data-professional-register-form><div class="form-grid"><div class="field"><label>Nome completo</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Telefone</label><input name="phone"></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Cidade</label><input name="city" required></div><div class="field"><label>Estado (UF)</label><input name="state" maxlength="2" required></div></div><div class="field"><label>Sobre você</label><textarea name="bio"></textarea></div><div class="field"><label>Serviços</label><div class="check-grid"><label class="check"><input type="checkbox" name="serviceIds" value="1">Cerimonial</label><label class="check"><input type="checkbox" name="serviceIds" value="2">Recepcionista</label><label class="check"><input type="checkbox" name="serviceIds" value="3">Garçom</label><label class="check"><input type="checkbox" name="serviceIds" value="4">Segurança</label><label class="check"><input type="checkbox" name="serviceIds" value="5">Fotografia</label><label class="check"><input type="checkbox" name="serviceIds" value="6">Filmagem</label><label class="check"><input type="checkbox" name="serviceIds" value="7">Decoração</label><label class="check"><input type="checkbox" name="serviceIds" value="8">Som</label><label class="check"><input type="checkbox" name="serviceIds" value="9">Iluminação</label><label class="check"><input type="checkbox" name="serviceIds" value="10">Buffet</label></div></div><button class="btn primary">Enviar cadastro</button></form><p class="auth-links"><a href="profissional-login.html">Voltar para login</a></p></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
