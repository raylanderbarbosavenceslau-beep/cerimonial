<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Imperio Cerimonial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-login-role="admin" class="admin-login-page">
    <main class="login">
        <section class="login-card">
            <a class="brand access-brand" href="inicio.html">✦ Imperio <span>Cerimonial</span></a>
            <span class="section-kicker">Acesso restrito</span>
            <h1>Área administrativa</h1>
            <p class="muted">Entre com a conta de administrador para gerenciar eventos, profissionais, orçamentos e planos.</p>
            <form class="form" data-login-form>
                <div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="username" required></div>
                <div class="field"><label for="password">Senha</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
                <button class="btn primary" type="submit">Entrar no painel</button>
            </form>
            <p class="auth-links"><a href="index.html">Voltar às opções de acesso</a></p>
            <p class="auth-links"><a href="inicio.html">Página inicial</a></p>
        </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
