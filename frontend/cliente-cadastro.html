<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cadastro de Cliente | Imperio Cerimonial</title><link rel="stylesheet" href="styles.css"></head><body><main class="login"><section class="login-card wide"><div class="brand">✦ Imperio Cerimonial</div><h1>Cadastro de cliente</h1><p class="muted">Crie sua conta para solicitar e acompanhar eventos.</p><form class="form" data-client-register-form><div class="form-grid"><div class="field"><label>Nome completo</label><input name="name" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Telefone</label><input name="phone"></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Cidade</label><input name="city" required></div><div class="field"><label>Estado (UF)</label><input name="state" maxlength="2" required></div></div><button class="btn primary">Criar conta</button></form><p class="auth-links">Já possui conta? <a href="cliente-login.html">Entrar</a></p></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
